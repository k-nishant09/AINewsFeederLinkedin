---
# Secrets template — NEVER commit real values.
# Populate via `oc create secret` or an external secrets operator.
#
# Usage:
#   cp openshift/secrets.yaml openshift/secrets.local.yaml
#   # Edit secrets.local.yaml with real values
#   oc apply -f openshift/secrets.local.yaml
#
# Or create directly from CLI:
#   oc create secret generic daily-news-secrets \
#     --from-literal=LLM_API_KEY=<your-key> \
#     --from-literal=GNEWS_API_KEY=<your-key> \
#     --from-literal=LINKEDIN_CLIENT_ID=<your-id> \
#     --from-literal=LINKEDIN_CLIENT_SECRET=<your-secret> \
#     --from-literal=LINKEDIN_ACCESS_TOKEN=<your-token> \
#     --from-literal=LINKEDIN_REDIRECT_URI=<your-redirect-uri> \
#     --from-literal=LINKEDIN_SCOPES="openid profile email w_member_social" \
#     --from-literal=LANGFUSE_PUBLIC_KEY=<your-key> \
#     --from-literal=LANGFUSE_SECRET_KEY=<your-key> \
#     -n aifeeders
apiVersion: v1
kind: Secret
metadata:
  name: daily-news-secrets
  namespace: aifeeders
type: Opaque
stringData:
  # IBM OpenShift Model Gateway bearer token
  LLM_API_KEY: "<your-llm-api-key>"

  # Internal MCP auth token (shared between API and MCP servers)
  MCP_AUTH_TOKEN: "<your-mcp-auth-token>"

  # GNews API key — free plan: https://gnews.io (100 req/day)
  GNEWS_API_KEY: "<your-gnews-api-key>"

  # LinkedIn Developer App — https://www.linkedin.com/developers/apps
  LINKEDIN_CLIENT_ID: "<your-linkedin-client-id>"
  LINKEDIN_CLIENT_SECRET: "<your-linkedin-client-secret>"

  # OAuth scopes — must include w_member_social for posts + comments
  LINKEDIN_SCOPES: "openid profile email w_member_social"

  # LinkedIn access token — obtain via GET /oauth/start on the linkedin-mcp service.
  # Expires after 60 days. Rotate before expiry.
  # Ref: https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow
  LINKEDIN_ACCESS_TOKEN: "<your-linkedin-access-token>"

  # Refresh token — only present if programmatic refresh tokens are enabled on the LinkedIn app.
  # Leave empty if not using programmatic refresh.
  # Ref: https://learn.microsoft.com/en-us/linkedin/shared/authentication/programmatic-refresh-tokens
  LINKEDIN_REFRESH_TOKEN: ""

  # Must match the redirect URI registered in the LinkedIn Developer Portal exactly.
  # Example: https://linkedin-mcp-<namespace>.apps.<cluster-domain>/oauth/callback
  LINKEDIN_REDIRECT_URI: "https://linkedin-mcp-aifeeders.apps.<your-cluster-domain>/oauth/callback"

  # Langfuse LLM tracing — optional, pipeline works without these.
  # Sign up at https://langfuse.com (free tier available)
  LANGFUSE_PUBLIC_KEY: "<your-langfuse-public-key>"
  LANGFUSE_SECRET_KEY: "<your-langfuse-secret-key>"
  LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
