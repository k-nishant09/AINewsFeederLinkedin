---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-mcp
  namespace: aifeeders
  labels:
    app: news-mcp
    role: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-mcp
  template:
    metadata:
      labels:
        app: news-mcp
        role: mcp-server
    spec:
      serviceAccountName: daily-news
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: news-mcp
      containers:
        - name: news-mcp
          image: image-registry.openshift-image-registry.svc:5000/aifeeders/news-mcp:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: daily-news-config
            - secretRef:
                name: daily-news-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
