---
# PodDisruptionBudget — ensure at least 1 replica available during node drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: daily-news-api-pdb
  namespace: aifeeders
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: daily-news-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: news-mcp-pdb
  namespace: aifeeders
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: news-mcp

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: linkedin-mcp-pdb
  namespace: aifeeders
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: linkedin-mcp
