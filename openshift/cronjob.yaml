---
# Daily AI News CronJob
# Runs at 10:00 UTC = 15:30 IST every day
# concurrencyPolicy: Forbid prevents double-runs if the previous job is still running
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-ai-news
  namespace: aifeeders
spec:
  schedule: "0 10 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 7200  # 2 hours max

      template:
        spec:
          serviceAccountName: daily-news
          restartPolicy: Never

          # app=daily-news-worker label is required by the NetworkPolicy
          # (allow-api-to-mcps) so the CronJob pod can reach all MCP servers.
          labels:
            app: daily-news-worker
          containers:
            - name: workflow-runner
              image: image-registry.openshift-image-registry.svc:5000/aifeeders/daily-news:latest
              command:
                - python
                - -m
                - daily_news.workflow_runner
              envFrom:
                - configMapRef:
                    name: daily-news-config
                - secretRef:
                    name: daily-news-secrets
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
