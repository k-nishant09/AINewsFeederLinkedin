---
# Daily AI News CronJob — single run at 20:00 UTC every day
# 20:00 UTC = 01:30 IST (next day)
# concurrencyPolicy: Forbid prevents double-runs if the previous job is still running
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-ai-news
  namespace: aifeeders
spec:
  schedule: "0 20 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600  # 1 hour max

      template:
        metadata:
          labels:
            app: daily-news-worker  # required by NetworkPolicy allow-api-to-mcps
        spec:
          serviceAccountName: daily-news
          restartPolicy: Never
          containers:
            - name: workflow-runner
              image: image-registry.openshift-image-registry.svc:5000/aifeeders/daily-news:latest
              command:
                - python
                - -m
                - daily_news.workflow_runner
              envFrom:
                - configMapRef:
                    name: daily-news-config
                - secretRef:
                    name: daily-news-secrets
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              volumeMounts:
                - name: aifeeders-store
                  mountPath: /data
          volumes:
            - name: aifeeders-store
              persistentVolumeClaim:
                claimName: aifeeders-store
