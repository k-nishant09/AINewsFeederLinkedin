---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-news-api
  namespace: aifeeders
  labels:
    app: daily-news-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daily-news-api
  template:
    metadata:
      labels:
        app: daily-news-api
    spec:
      serviceAccountName: daily-news
      # Spread replicas evenly across all schedulable worker nodes so no single
      # node is double-burdened when HPA scales up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: daily-news-api
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/aifeeders/daily-news:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: daily-news-config
            - secretRef:
                name: daily-news-secrets
          # Requests sized to actual observed usage (2m CPU, ~100Mi memory).
          # Limits give headroom for workflow bursts (LLM calls, concurrent agents).
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: aifeeders-store
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: aifeeders-store
          persistentVolumeClaim:
            claimName: aifeeders-store
