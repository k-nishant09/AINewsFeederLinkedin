---
# Secret — all values are injected at deploy time via --set secrets.*
# NEVER commit real values. Use `helm upgrade --install --set secrets.llmApiKey=...`
# or inject via External Secrets Operator / AWS Secrets Manager / Azure Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: daily-news-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aifeeders.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ required "secrets.llmApiKey is required — pass via --set secrets.llmApiKey=<value>" .Values.secrets.llmApiKey | quote }}
  MCP_AUTH_TOKEN: {{ required "secrets.mcpAuthToken is required — pass via --set secrets.mcpAuthToken=<value>" .Values.secrets.mcpAuthToken | quote }}
  GNEWS_API_KEY: {{ required "secrets.gnewsApiKey is required — pass via --set secrets.gnewsApiKey=<value>" .Values.secrets.gnewsApiKey | quote }}
  LINKEDIN_CLIENT_ID: {{ required "secrets.linkedinClientId is required — pass via --set secrets.linkedinClientId=<value>" .Values.secrets.linkedinClientId | quote }}
  LINKEDIN_CLIENT_SECRET: {{ required "secrets.linkedinClientSecret is required — pass via --set secrets.linkedinClientSecret=<value>" .Values.secrets.linkedinClientSecret | quote }}
  # OAuth scopes — must include w_member_social for posts + comments
  LINKEDIN_SCOPES: {{ required "secrets.linkedinScopes is required — pass via --set secrets.linkedinScopes=<value>" .Values.secrets.linkedinScopes | quote }}
  LINKEDIN_ACCESS_TOKEN: {{ required "secrets.linkedinAccessToken is required — pass via --set secrets.linkedinAccessToken=<value>" .Values.secrets.linkedinAccessToken | quote }}
  # Refresh token — empty string if programmatic refresh tokens not enabled
  LINKEDIN_REFRESH_TOKEN: {{ .Values.secrets.linkedinRefreshToken | default "" | quote }}
  # Must match redirect URI in LinkedIn Developer Portal exactly
  LINKEDIN_REDIRECT_URI: {{ required "secrets.linkedinRedirectUri is required — pass via --set secrets.linkedinRedirectUri=<value>" .Values.secrets.linkedinRedirectUri | quote }}
  LANGFUSE_PUBLIC_KEY: {{ required "secrets.langfusePublicKey is required — pass via --set secrets.langfusePublicKey=<value>" .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ required "secrets.langfuseSecretKey is required — pass via --set secrets.langfuseSecretKey=<value>" .Values.secrets.langfuseSecretKey | quote }}
  LANGFUSE_BASE_URL: {{ .Values.secrets.langfuseBaseUrl | default .Values.langfuse.host | quote }}
